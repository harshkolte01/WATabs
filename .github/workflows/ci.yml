name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests, package
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build shared packages
        run: pnpm --filter @multi-whatsapp/shared-types --filter @multi-whatsapp/validation run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, security, and integration tests
        run: pnpm test:unit

      - name: Verify no WhatsApp injection / prohibited patterns
        run: pnpm verify:no-injection

      - name: Assert desktop version matches root
        shell: pwsh
        run: |
          $root = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desk = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($root -ne $desk) { throw "Version mismatch root=$root desktop=$desk" }
          Write-Host "version=$desk"

      - name: Package desktop (WATabs)
        run: pnpm package

      - name: Verify Electron fuses
        run: pnpm verify:fuses

      - name: Make Windows NSIS installer
        run: pnpm --filter @multi-whatsapp/desktop run make

      - name: Verify Windows release artifacts
        run: pnpm exec tsx scripts/verify-windows-release.ts apps/desktop/out

      - name: Dependency audit (informational)
        continue-on-error: true
        run: pnpm audit --prod
