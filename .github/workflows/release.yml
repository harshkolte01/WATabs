name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build shared packages
        run: pnpm --filter @multi-whatsapp/shared-types --filter @multi-whatsapp/validation run build

      - name: Decode Windows code-signing cert
        env:
          WINDOWS_CODE_SIGN_CERT: ${{ secrets.WINDOWS_CODE_SIGN_CERT }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGN_CERT)) {
            Write-Host "No WINDOWS_CODE_SIGN_CERT secret — building unsigned."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CODE_SIGN_CERT)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\watabs-codesign.pfx", $bytes)
          "WINDOWS_CODE_SIGN_CERT_PATH=$env:RUNNER_TEMP\watabs-codesign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HAS_WINDOWS_CERT=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Decoded Windows code-signing certificate."

      - name: Make Windows NSIS installer
        env:
          WINDOWS_CODE_SIGN_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PASSWORD }}
        run: pnpm --filter @multi-whatsapp/desktop run make

      - name: Verify Windows release artifacts
        run: pnpm exec tsx scripts/verify-windows-release.ts apps/desktop/out

      - name: Verify Authenticode signature
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path apps/desktop/out -Recurse -Filter "*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No WATabs-*-Setup.exe found to verify" }
          Write-Host "Verifying $($setup.FullName)"
          $sig = Get-AuthenticodeSignature -FilePath $setup.FullName
          Write-Host "Status: $($sig.Status) Signer: $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate) { throw "No Authenticode signer certificate on build artifact" }
          if ($sig.Status -eq "NotSigned") { throw "Artifact is NotSigned" }
          Write-Host "Signature present (self-signed OK for pipeline; CA certs should show Status=Valid)."

      - name: Package for fuse verify
        run: pnpm package

      - name: Verify Electron fuses
        run: pnpm verify:fuses

      - name: Release artifacts (checksums + SBOM)
        run: pnpm exec tsx scripts/release-artifacts.ts apps/desktop/out

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/out/make/**/*-Setup.exe
            apps/desktop/out/make/**/*.yml
            apps/desktop/out/make/**/*.yaml
            apps/desktop/out/make/**/*.blockmap
            apps/desktop/out/release-meta/**

  macos:
    name: Build macOS
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build shared packages
        run: pnpm --filter @multi-whatsapp/shared-types --filter @multi-whatsapp/validation run build

      - name: Make macOS ZIP (unsigned — Apple signing out of scope)
        run: pnpm --filter @multi-whatsapp/desktop run make

      - name: Assert macOS ZIP exists
        run: |
          count=$(find apps/desktop/out -type f -name '*.zip' | wc -l | tr -d ' ')
          echo "zip count=$count"
          test "$count" -ge 1

      - name: Release artifacts (checksums + SBOM)
        run: pnpm exec tsx scripts/release-artifacts.ts apps/desktop/out

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            apps/desktop/out/**/*.zip
            apps/desktop/out/**/*.dmg
            apps/desktop/out/release-meta/**

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: dist/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: dist/macos

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          # NSIS Setup only — never ship unpackaged WATabs.exe from package output
          find dist/windows -type f \( \
            -name '*-Setup.exe' -o -name 'latest.yml' -o -name 'latest.yaml' -o \
            -name '*.blockmap' -o -name 'SHA256SUMS.txt' -o -name 'sbom.json' \
          \) -exec cp -n {} dist/upload/ \;
          find dist/macos -type f \( \
            -name '*.zip' -o -name '*.dmg' -o -name 'SHA256SUMS.txt' -o -name 'sbom.json' \
          \) -exec cp -n {} dist/upload/ \;
          ls -la dist/upload
          setup_count=$(find dist/upload -type f -name '*-Setup.exe' | wc -l | tr -d ' ')
          yml_count=$(find dist/upload -type f -name 'latest.yml' | wc -l | tr -d ' ')
          echo "setup_count=$setup_count yml_count=$yml_count"
          test "$setup_count" -ge 1
          test "$yml_count" -ge 1
          echo "count=$(find dist/upload -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: dist/upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
