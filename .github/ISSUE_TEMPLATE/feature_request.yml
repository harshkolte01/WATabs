name: Feature request
description: Suggest an improvement within the product boundary (local shell only)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests that require WhatsApp automation, scraping, injection, or cloud sync of chats are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary check
      options:
        - label: This does not require reading WhatsApp message/DOM content or injecting into account views
          required: true
