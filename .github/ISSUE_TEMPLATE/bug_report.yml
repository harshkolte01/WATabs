name: Bug report
description: Report a problem in WATabs (multi-account desktop shell)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Independent project — not affiliated with WhatsApp LLC or Meta.
        Do **not** paste chat contents, QR codes, cookies, or session files.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / Electron version
      description: From Settings diagnostics or window footer (e.g. Electron 43.2.0)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Redacted logs only. Never include PIN, messages, or partition paths.
